name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev tmux pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ncurses tmux
          command -v pkg-config >/dev/null || brew install pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix ncurses)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Versions
        run: |
          git --version
          $CC --version
          pkg-config --modversion ncursesw || pkg-config --modversion ncurses

      - name: make check
        run: make check

      - name: make check SANITIZE=1
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export ASAN_OPTIONS=detect_leaks=0
          fi
          make clean
          make check SANITIZE=1

  quality:
    name: lint, analyze, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev tmux pkg-config \
            shellcheck codespell cppcheck
          pip install --user lizard 'clang-tidy==22.*' 'clang-format==22.*'
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: make lint
        run: make lint

      - name: make analyze
        run: make analyze

      - name: make coverage
        run: make coverage COVERAGE_MIN=85
